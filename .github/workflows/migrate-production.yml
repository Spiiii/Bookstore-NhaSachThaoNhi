name: Migrate production database

on:
  workflow_dispatch:

concurrency:
  group: production-database-migration
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 10.34.5

jobs:
  migrate:
    name: Apply committed Prisma migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @bookstore/api exec prisma generate
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm --filter @bookstore/api exec prisma migrate deploy
