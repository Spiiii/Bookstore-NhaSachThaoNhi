services:
  postgres:
    # Test-only PostgreSQL major; production version still follows deployment approval.
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Inject a random test-only password}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30
